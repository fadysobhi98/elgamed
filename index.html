@font-face{font-family:'Cairo';font-weight:400;font-display:swap;src:url(https://fonts.gstatic.com/s/cairo/v31/SLXgc1nY6HkvangtZmpQdkhzfH5lkSs2SgRjCAGMQ1z0hOA-W1Q.ttf) format('truetype')}
@font-face{font-family:'Cairo';font-weight:700;font-display:swap;src:url(https://fonts.gstatic.com/s/cairo/v31/SLXgc1nY6HkvangtZmpQdkhzfH5lkSs2SgRjCAGMQ1z0hAc5W1Q.ttf) format('truetype')}
@font-face{font-family:'Cairo';font-weight:800;font-display:swap;src:url(https://fonts.gstatic.com/s/cairo/v31/SLXgc1nY6HkvangtZmpQdkhzfH5lkSs2SgRjCAGMQ1z0hGA5W1Q.ttf) format('truetype')}
:root{
  --bg:#0b0d10; --card:#14171d; --card2:#1b1f27; --line:#262c37;
  --txt:#f4f6fa; --mut:#8f99ab;
  --acc:#a3e635; --acc2:#22c55e; --grad:linear-gradient(135deg,#a3e635,#22c55e);
  --warn:#fbbf24; --red:#f87171; --blue:#60a5fa;
  --r:20px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
  font-family:'Cairo',-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
body{padding-bottom:calc(92px + env(safe-area-inset-bottom));
  background:
    radial-gradient(600px 300px at 85% -5%, rgba(163,230,53,.10), transparent 60%),
    radial-gradient(500px 300px at 10% 0%, rgba(34,197,94,.08), transparent 60%),
    var(--bg)}
.app{max-width:480px;margin:0 auto;padding:20px 16px 0}
h1{font-size:26px;font-weight:800;margin:4px 0 2px;letter-spacing:-.3px}
.sub{color:var(--mut);font-size:14px;margin:0 0 18px;line-height:1.7}
.brand{font-size:34px;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;display:inline-block}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:15px;font-size:17px;font-weight:800;
  background:var(--grad);color:#0b1a06;cursor:pointer;font-family:inherit;box-shadow:0 8px 24px rgba(34,197,94,.25)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--card2);color:var(--txt);border:1px solid var(--line);box-shadow:none}
.btn.small{width:auto;padding:9px 16px;font-size:13.5px;display:inline-block;border-radius:12px}
.btn.danger{background:transparent;color:var(--red);border:1px solid var(--red);box-shadow:none}
input[type=text],input[type=number]{width:100%;background:var(--card2);border:1.5px solid var(--line);color:var(--txt);
  border-radius:14px;padding:13px;font-size:17px;font-family:inherit;font-weight:700}
input:focus{outline:0;border-color:var(--acc2);box-shadow:0 0 0 3px rgba(34,197,94,.18)}
label{display:block;font-size:13px;font-weight:700;color:var(--mut);margin:14px 0 7px}
.split-card{background:var(--card2);border:2px solid var(--line);border-radius:18px;padding:15px;margin-bottom:10px;
  cursor:pointer;transition:border-color .15s}
.split-card.sel{border-color:var(--acc);background:linear-gradient(135deg,rgba(163,230,53,.12),rgba(34,197,94,.06))}
.split-card b{font-size:16px;font-weight:800;display:block;margin-bottom:3px}
.split-card span{font-size:13px;color:var(--mut);line-height:1.6}
.hero{border-radius:26px;padding:26px 18px;text-align:center;position:relative;overflow:hidden;
  background:linear-gradient(160deg,#15250f,#10151c 60%);border:1px solid #33512a;margin-bottom:14px}
.hero::before{content:"";position:absolute;inset:-40%;background:radial-gradient(circle at 70% 0%,rgba(163,230,53,.22),transparent 55%);pointer-events:none}
.hero .kicker{font-size:13px;font-weight:700;color:#bef264}
.hero .big{font-size:26px;font-weight:800;margin:6px 0 2px;position:relative}
.chips{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin:12px 0 4px;position:relative}
.chip{background:rgba(163,230,53,.14);border:1px solid rgba(163,230,53,.35);color:#d9f99d;border-radius:999px;
  padding:6px 14px;font-size:13px;font-weight:700}
.check{width:84px;height:84px;border-radius:50%;border:0;background:var(--grad);color:#0b1a06;font-size:40px;
  cursor:pointer;margin:18px auto 6px;display:block;position:relative;
  box-shadow:0 10px 30px rgba(163,230,53,.4), 0 0 0 8px rgba(163,230,53,.08);
  animation:pulse 2.2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 10px 30px rgba(163,230,53,.4),0 0 0 6px rgba(163,230,53,.10)}
  50%{box-shadow:0 10px 30px rgba(163,230,53,.5),0 0 0 14px rgba(163,230,53,.04)}}
.check:active{transform:scale(.92);animation:none}
.rowbtns{display:flex;gap:8px;justify-content:center;margin-top:12px;position:relative}
.done-card{border-radius:26px;text-align:center;padding:26px 18px;margin-bottom:14px;position:relative;overflow:hidden;
  background:linear-gradient(160deg,#0f1f2e,#10151c 60%);border:1px solid #27455f}
.done-card::before{content:"";position:absolute;inset:-40%;background:radial-gradient(circle at 30% 0%,rgba(96,165,250,.2),transparent 55%);pointer-events:none}
.done-card .big{font-size:22px;font-weight:800;margin:10px 0 4px;position:relative}
.streak{display:inline-flex;align-items:center;gap:6px;background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.35);
  color:#fde68a;border-radius:999px;padding:5px 14px;font-size:13px;font-weight:800;margin-top:4px}
.week{display:flex;gap:7px;overflow-x:auto;padding:2px}
.wday{flex:1;min-width:66px;background:var(--card2);border:1.5px solid var(--line);border-radius:14px;
  padding:9px 4px;text-align:center;font-size:11px;font-weight:700;color:var(--mut)}
.wday b{display:block;font-size:12.5px;color:var(--txt);margin-top:4px;font-weight:800}
.wday.today{border-color:var(--acc);color:#d9f99d;background:linear-gradient(135deg,rgba(163,230,53,.14),transparent)}
.tabs{display:flex;gap:7px;overflow-x:auto;margin-bottom:14px;padding-bottom:2px}
.tab{flex:0 0 auto;background:var(--card2);border:1.5px solid var(--line);color:var(--mut);border-radius:999px;
  padding:9px 17px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.tab.on{background:var(--grad);color:#0b1a06;border-color:transparent}
.ex{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.ex .head{display:flex;gap:12px;align-items:center}
.ex img{width:76px;height:76px;border-radius:14px;background:#fff;object-fit:contain;flex:0 0 auto;border:1px solid var(--line)}
.ex .nm{font-weight:800;font-size:15.5px}
.ex .cue{font-size:12.5px;color:var(--mut);margin-top:3px;line-height:1.7}
.logrow{display:flex;gap:8px;margin-top:12px;align-items:end}
.logrow .fld{flex:1}
.logrow label{margin:0 0 5px;font-size:11px}
.logrow input{padding:10px;font-size:15px;text-align:center}
.logsave{flex:0 0 auto;background:var(--grad);border:0;color:#0b1a06;border-radius:14px;
  padding:11px 18px;font-weight:800;font-size:14px;cursor:pointer;font-family:inherit}
.last{font-size:12.5px;color:#bef264;font-weight:700;margin-top:9px}
.hist{font-size:12px;color:var(--mut);margin-top:7px;border-top:1px dashed var(--line);padding-top:7px;display:none;line-height:1.9}
.ex.open .hist{display:block}
.hist-toggle{font-size:11.5px;color:var(--mut);margin-top:7px;cursor:pointer;text-decoration:underline;background:none;border:0;font-family:inherit;padding:0}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-h b{font-size:15px;font-weight:800}.cal-h button{background:var(--card2);border:1.5px solid var(--line);color:var(--txt,#fff);border-radius:10px;width:38px;height:36px;font-size:18px;cursor:pointer;font-family:inherit}
.cal-h button:disabled{opacity:.35}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal-w{font-size:10.5px;color:var(--mut);text-align:center;padding-bottom:2px}
.cal-d{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:9px;font-size:13px;font-weight:700;background:var(--card2);color:var(--mut);border:1.5px solid transparent}
.cal-d.on{background:var(--grad);color:#0b1a06;border-color:transparent}
.cal-d.td{border-color:#93c5fd}.cal-d.e{background:none}
.cal-cnt{margin-top:10px;font-size:14px;font-weight:800;text-align:center}
.plan-ex{display:flex;width:100%;align-items:center;justify-content:space-between;gap:8px;background:none;border:0;border-bottom:1px solid var(--line);color:var(--txt);font:inherit;font-size:13.5px;padding:9px 2px;text-align:start;cursor:pointer}
.plan-ex span{color:#93c5fd;font-size:11px;white-space:nowrap}
.ex.hl{outline:2px solid #c7ff3d;box-shadow:0 0 0 4px rgba(199,255,61,.18)}
.navbar{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom));right:12px;left:12px;max-width:456px;margin:0 auto;
  background:rgba(20,23,29,.92);border:1px solid var(--line);border-radius:22px;
  backdrop-filter:blur(14px);display:flex;padding:6px;box-shadow:0 12px 32px rgba(0,0,0,.5)}
.navbtn{flex:1;background:none;border:0;color:var(--mut);font-size:11.5px;font-weight:700;padding:8px 0;border-radius:16px;cursor:pointer;font-family:inherit}
.navbtn .ic{font-size:19px;display:block;margin-bottom:1px}
.navbtn.on{color:#0b1a06;background:var(--grad)}
.note{font-size:12.5px;color:var(--mut);background:var(--card2);border-radius:14px;padding:11px 13px;line-height:1.8}
.setrow{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line)}
.setrow:last-child{border:0}
.setrow .t{font-size:15px;font-weight:800}
.setrow .d{font-size:12.5px;color:var(--mut);margin-top:2px}
.credit{font-size:12px;color:var(--mut);border-bottom:1px dashed var(--line);padding:8px 0;line-height:1.7}
.center{text-align:center}
.mut{color:var(--mut)}
.toast{position:fixed;top:calc(14px + env(safe-area-inset-top));right:50%;transform:translateX(50%);
  background:var(--grad);color:#0b1a06;font-weight:800;padding:11px 22px;border-radius:999px;
  font-size:14px;z-index:99;display:none;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.hide{display:none!important}
.friend{display:flex;align-items:center;justify-content:space-between;background:var(--card2);
  border:1px solid var(--line);border-radius:16px;padding:13px 15px;margin-bottom:9px}
.friend .n{font-weight:800;font-size:15px}
.friend .d{font-size:12.5px;color:var(--mut);margin-top:2px}
.badge{background:rgba(163,230,53,.14);border:1px solid rgba(163,230,53,.35);color:#d9f99d;
  border-radius:999px;padding:5px 13px;font-size:12.5px;font-weight:800;white-space:nowrap}
.badge.off{background:var(--card);border-color:var(--line);color:var(--mut)}
.codebox{background:#0b0d10;border:1.5px dashed var(--acc2);border-radius:14px;padding:13px;text-align:center;
  font-size:22px;font-weight:800;letter-spacing:3px;color:#d9f99d}

/* Iron edition */
:root {--r:12px;--acc:#c4ff30;--grad:linear-gradient(115deg,#d9ff47,#8fdf00)}
body{background:repeating-linear-gradient(130deg,transparent 0 60px,#ffffff02 60px 61px),radial-gradient(ellipse at 100% 0,#39500030,transparent 50%),#090b0d}
.app{padding-top:18px}
.brand{font-size:58px;line-height:1.3;letter-spacing:-3px;font-weight:800;transform:skew(-5deg)}
.brandline{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;border-bottom:1px solid #3c452c;padding-bottom:16px}
.brandline small{font:800 10px Arial;letter-spacing:3px;color:#afbd9b}
.brandline .brand{font-size:28px;letter-spacing:-1px}
h1{font-size:29px;line-height:1.5;font-weight:800}
.card,.ex{border-radius:12px;border-color:#30352f;background:linear-gradient(140deg,#181c1e,#101315)}
.hero{border-radius:12px;text-align:right;padding:24px;border-color:#5c702a;border-right:5px solid #c4ff30;background:linear-gradient(120deg,#161c10,#0d110b);isolation:isolate}
.hero .big{font-size:34px;line-height:1.5;font-weight:800;max-width:77%}
.hero .kicker{font-size:11px;letter-spacing:2px;color:#d9ff47}
.hero .chips{justify-content:flex-start;max-width:82%}
.hero:after{content:"";position:absolute;left:-54px;top:22px;width:170px;height:170px;border:20px solid #637b2a33;border-radius:50%;box-shadow:0 0 0 4px #c4ff3012,0 0 0 24px #c4ff3005;z-index:-1}
.check{border-radius:16px;width:78px;height:70px;margin:22px 0 8px;transform:skew(-5deg);animation:none;box-shadow:5px 6px 0 #4b6300}
.check:active{transform:translateY(3px) skew(-5deg);box-shadow:2px 3px 0 #4b6300}
.hero .rowbtns{justify-content:flex-start}.hero .mut{font-size:11px!important}
.btn,.logsave{border-radius:8px;box-shadow:none}
.btn.ghost{border-color:#37422e}
.split-card{border-radius:10px;border-width:1px;border-right-width:5px}
.split-card.sel{border-color:#c4ff30}
.navbar{border-radius:14px;background:#111611f5;border-color:#37432b;box-shadow:0 8px 40px #000}
.navbtn{border-radius:9px}.navbtn .ic{height:25px;line-height:25px;font-family:Arial;font-size:21px}
.wday{border-radius:8px}.tab{border-radius:8px}.chip{border-radius:4px;padding:4px 10px}
.done-card{border-radius:12px;border-color:#536932;background:linear-gradient(135deg,#253213,#101511);text-align:right}
.done-card .big{font-size:27px}
.plate{width:62px;height:62px;border:7px double #bff536;border-radius:50%;display:grid;place-items:center;color:#c4ff30;font:900 17px Arial;transform:rotate(-12deg)}
.eyebrow{font:900 10px Arial;letter-spacing:3px;color:#b8d27c;margin-bottom:10px}
.logrow .fld{min-width:0}.logrow{gap:5px}.logsave{padding:11px}.ex img{border-radius:8px;width:80px;height:80px}
.friend{display:block}.friend .badge{display:inline-block;white-space:normal;margin-top:8px}.codebox{font-size:17px;letter-spacing:1px;word-break:break-all}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.video-link{display:flex;align-items:center;justify-content:center;gap:12px;min-height:46px;margin:12px 0 8px;padding:10px 14px;border:1px solid #40572c;border-radius:12px;color:#d9f99d;background:#1c2916;text-decoration:none;font-size:14px;font-weight:800}.video-link:active{background:#2b3f20}
input[type=date]{width:100%;background:var(--card2);border:1.5px solid var(--line);color:var(--txt);border-radius:14px;padding:13px;font-size:15px;font-family:inherit;font-weight:700;color-scheme:dark}
.sup-row{padding:10px 0;border-bottom:1px solid var(--line)}
.sup-row:last-of-type{border:0}
.sup-nm{font-size:14px;font-weight:800;margin-bottom:7px}
.sup-ctl{display:flex;flex-wrap:wrap;gap:6px}
.sup-ctl .tab{padding:6px 13px;font-size:12.5px}
.ib-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.ib-grid .fld label{margin-top:10px}
.ib-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13px}
.ib-row:last-child{border:0}
.ib-nm{font-weight:800}
.ib-vals{color:var(--mut);font-size:12px;white-space:nowrap}
.ib-d{font-weight:800;white-space:nowrap;font-size:12.5px}
.good{color:#4ade80}.bad{color:#f87171}.neu{color:#93c5fd}

/* LTR layout overrides */
.langbtn{background:var(--card2);border:1.5px solid var(--line);color:var(--txt);border-radius:10px;padding:6px 12px;font:800 12px Cairo,Arial,sans-serif;cursor:pointer;align-self:center}
html[dir="ltr"] .hero,html[dir="ltr"] .done-card{text-align:left}
html[dir="ltr"] .hero{border-right-width:1px;border-left:5px solid #c4ff30}
html[dir="ltr"] .split-card{border-right-width:1px;border-left-width:5px}
html[dir="ltr"] .plan-ex{text-align:left}
html[dir="ltr"] .hero:after{left:auto;right:-54px}
/* V11 nutrition */

<script>window.SUPA = {"enabled": true, "url": "https://vyjuinskghnfndvchlkv.supabase.co", "anonKey": "sb_publishable_cazN6xdYu_i1j0GLskPNhA_LRAm__gD"};</script>

<script>/* الجامد — gym tracker. Local-first; optional friends sync via Supabase (name + today's day only). */
(function(){
"use strict";

const KEY = "gymtracker.v1";
const SUPA = window.SUPA || {enabled:false};

const GROUPS = { chest:["صدر","Chest"], back:["ضهر","Back"], shoulders:["كتف","Shoulders"], arms:["دراع","Arms"], legs:["أرجل","Legs"], abs:["بطن","Abs"] };
const GROUP_ICONS = { chest:"🦅", back:"🧗", shoulders:"🤷", arms:"💪", legs:"🦵", abs:"🧱" };
const TAG_EN = { biceps:"Biceps", triceps:"Triceps", forearms:"Forearms", "أمامية":"Quads", "خلفية":"Hamstrings", "سمانة":"Calves", "جلووتس":"Glutes", "ضامة":"Adductors", "ترابيس":"Traps", "لاتس":"Lats", "ظهر أوسط":"Mid Back", "ظهر سفلي":"Lower Back", "صدر علوي":"Upper Chest", "صدر أوسط":"Mid Chest", "صدر سفلي":"Lower Chest", "كتف أمامي":"Front Delts", "كتف جانبي":"Side Delts", "كتف خلفي":"Rear Delts", "جناب":"Obliques", "بطن":"Abs" };

const SPLITS = {
  arnold: { name:"أرنولد سبليت", nameEn:"Arnold Split", desc:"صدر+ضهر / كتف+دراع / أرجل — أسلوب أرنولد شوارزنيجر", descEn:"Chest+Back / Shoulders+Arms / Legs — the Arnold Schwarzenegger way",
    days:[
      {label:"صدر + ضهر", labelEn:"Chest + Back", parts:[["chest"],["back"]]},
      {label:"كتف + دراع", labelEn:"Shoulders + Arms", parts:[["shoulders"],["arms"]]},
      {label:"أرجل + بطن", labelEn:"Legs + Abs", parts:[["legs"],["abs"]]},
    ]},
  ppl: { name:"بوش بول ليج (Push Pull Legs)", nameEn:"Push Pull Legs", desc:"دفع (صدر+كتف+تراي) / سحب (ضهر+باي) / أرجل", descEn:"Push (chest+shoulders+triceps) / Pull (back+biceps) / Legs",
    days:[
      {label:"دفع — صدر + كتف + تراي", labelEn:"Push — Chest + Shoulders + Triceps", parts:[["chest"],["shoulders"],["arms","triceps"]]},
      {label:"سحب — ضهر + باي", labelEn:"Pull — Back + Biceps", parts:[["back"],["arms","biceps"]]},
      {label:"أرجل + بطن", labelEn:"Legs + Abs", parts:[["legs"],["abs"]]},
    ]},
  bro: { name:"برو سبليت (عضلة كل يوم)", nameEn:"Bro Split (one muscle a day)", desc:"كل يوم عضلة واحدة: صدر، ضهر، كتف، دراع، أرجل، بطن", descEn:"One muscle per day: chest, back, shoulders, arms, legs, abs",
    days:[
      {label:"صدر", labelEn:"Chest", parts:[["chest"]]},
      {label:"ضهر", labelEn:"Back", parts:[["back"]]},
      {label:"كتف", labelEn:"Shoulders", parts:[["shoulders"]]},
      {label:"دراع", labelEn:"Arms", parts:[["arms"]]},
      {label:"أرجل", labelEn:"Legs", parts:[["legs"]]},
      {label:"بطن", labelEn:"Abs", parts:[["abs"]]},
    ]},
  upperlower: { name:"علوي / سفلي", nameEn:"Upper / Lower", desc:"يوم جسم علوي ويوم جسم سفلي بالتبادل", descEn:"Alternating upper-body and lower-body days",
    days:[
      {label:"جسم علوي", labelEn:"Upper Body", parts:[["chest"],["back"],["shoulders"],["arms"]]},
      {label:"جسم سفلي + بطن", labelEn:"Lower Body + Abs", parts:[["legs"],["abs"]]},
    ]},
  fullbody: { name:"جسم كامل", nameEn:"Full Body", desc:"كل المجموعات في كل تمرين", descEn:"Every muscle group in every workout",
    days:[
      {label:"جسم كامل", labelEn:"Full Body", parts:[["chest"],["back"],["shoulders"],["arms"],["legs"],["abs"]]},
    ]},
  free: { name:"تمرين حر", nameEn:"Free Workout", desc:"مفيش نظام ثابت — إنت اللي بتختار عضلات كل يوم وتمارينك بنفسك", descEn:"No fixed plan — you pick the muscles and exercises for each day yourself",
    days:[] },
};

let S = load();

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){ const s = JSON.parse(raw); if(s && typeof s==="object" && Array.isArray(s.history) && s.log) return Object.assign({friends:[],sharing:false,sups:{},inbody:[],freeSel:[],lang:"ar"},s); }
  }catch(e){}
  return { name:"", split:null, dayIndex:0, lastDone:null, log:{}, history:[], friendCode:null, friends:[], sups:{}, inbody:[], freeSel:[], lang:null };
}
function save(){ localStorage.setItem(KEY, JSON.stringify(S)); }

/* ---------- language ---------- */
function curLang(){ return S.lang==="en" ? "en" : "ar"; }
function t(ar,en){ return curLang()==="en" ? en : ar; }
function G(g){ const x=GROUPS[g]; return x ? t(x[0],x[1]) : g; }
function tagLabel(k){ if(curLang()==="en") return TAG_EN[k]||k; return ({biceps:"باي",triceps:"تراي",forearms:"ساعد"})[k]||k; }
function spName(sp){ return t(sp.name, sp.nameEn||sp.name); }
function spDesc(sp){ return t(sp.desc, sp.descEn||sp.desc); }
function dayLbl(d){ return t(d.label, d.labelEn||d.label); }
function applyLang(){
  const l = curLang();
  document.documentElement.lang = l;
  document.documentElement.dir = l==="ar" ? "rtl" : "ltr";
  document.title = t("الجامد","El Gamed");
}
function setLang(l){
  S.lang = l; save(); applyLang(); render();
}
function renderLangPick(){
  navbar.classList.add("hide");
  view.innerHTML = `
    <div class="center" style="margin-top:56px"><span class="brand">الجامد</span><div class="eyebrow" style="margin-top:14px">LIFT. LOG. REPEAT.</div></div>
    <div class="card" style="margin-top:22px">
      <b style="font-size:15px;font-weight:800;display:block;text-align:center;margin-bottom:14px">اختار لغتك · Choose your language</b>
      <button class="btn" id="lar" style="margin-bottom:10px">العربية</button>
      <button class="btn ghost" id="len">English</button>
    </div>`;
  view.querySelector("#lar").onclick = ()=>setLang("ar");
  view.querySelector("#len").onclick = ()=>setLang("en");
}

function todayStr(){
  const d = new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function dayAgo(str){
  const t0 = todayStr();
  if(str===t0) return t("النهاردة","Today");
  const a = new Date(str+"T12:00:00"), b = new Date(t0+"T12:00:00");
  const diff = Math.round((b-a)/86400000);
  if(diff===1) return t("إمبارح","Yesterday");
  if(diff>1) return t("من "+diff+" أيام", diff+" days ago");
  return esc(str);
}
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function toast(msg){
  const tt = document.getElementById("toast");
  tt.textContent = msg; tt.style.display="block";
  clearTimeout(tt._h); tt._h = setTimeout(()=>tt.style.display="none", 2200);
}
function streak(){
  if(!S.history.length) return 0;
  const days = new Set(S.history.map(h=>h.date));
  let n = 0;
  const d = new Date();
  if(!days.has(todayStr())) d.setDate(d.getDate()-1); // today not done yet: count back from yesterday
  while(days.has(d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"))){
    n++; d.setDate(d.getDate()-1);
  }
  return n;
}

/* ---------- exercise helpers ---------- */
function exByGroup(group, sub){
  return EXERCISES.filter(e=>e.group===group && (!sub || e.sub===sub || (group!=="arms")));
}
function exName(e){ return curLang()==="en" ? e.en : e.ar; }
function exCue(e){ return curLang()==="en" ? (e.cueEn||e.cue) : e.cue; }
function lastLog(id){
  const arr = S.log[id];
  return arr && arr.length ? arr[arr.length-1] : null;
}

/* ---------- friends: opt-in, anonymous per-device ownership, code-only lookup ---------- */
const DB = SUPA.enabled && window.supabase ? window.supabase.createClient(SUPA.url,SUPA.anonKey) : null;
let authReady;
async function identity(){
  if(!DB) throw Error('unavailable');
  if(!authReady) authReady=(async()=>{let {data:{session}}=await DB.auth.getSession();
    if(!session){const r=await DB.auth.signInAnonymously();if(r.error)throw r.error;session=r.data.session;}return session.user.id;})();
  try{return await authReady;}catch(e){authReady=null;throw e;}
}
function todayLabel(){
  if(S.lastDone===todayStr() && S.history.length) return t('خلص: ','Done: ')+S.history[S.history.length-1].day;
  if(S.split==="free") return t('تمرين حر','Free Workout');
  return dayLbl(SPLITS[S.split].days[S.dayIndex%SPLITS[S.split].days.length]);
}
async function pushMyStatusUpsert(){
  if(!DB || !S.sharing || !S.name || !S.split)return;
  try{const uid=await identity();
    const r=await DB.from('gym_status').upsert({owner_id:uid,name:S.name.slice(0,50),day:todayLabel(),status_date:todayStr(),updated_at:new Date().toISOString()},{onConflict:'owner_id'}).select('code').single();
    if(r.error)throw r.error; S.friendCode=r.data.code;save();return true;
  }catch(e){return false;}
}
function pairOr(me,other){return `and(a.eq.${me},b.eq.${other}),and(a.eq.${other},b.eq.${me})`;}
async function linkFriend(other){
  if(!S.friendCode)throw Error('no code');
  const ex=await DB.from('gym_links').select('a,b').or(pairOr(S.friendCode,other));
  if(ex.error)throw ex.error;
  if(ex.data&&ex.data.length)return;
  const r=await DB.from('gym_links').insert({a:S.friendCode,b:other});
  if(r.error&&r.error.code!=='23505')throw r.error;
}
async function unlinkFriend(other){
  if(!S.friendCode)return;
  const r=await DB.from('gym_links').delete().or(pairOr(S.friendCode,other));
  if(r.error)throw r.error;
}
async function unlinkAll(){
  if(!S.friendCode)return;
  const r=await DB.from('gym_links').delete().or(`a.eq.${S.friendCode},b.eq.${S.friendCode}`);
  if(r.error)throw r.error;
}
async function fetchFriends(){
  await identity();
  if(S.friends&&S.friends.length){for(const code of S.friends){try{await linkFriend(code);}catch(e){}}S.friends=[];save();}
  const out=[];
  if(!S.friendCode)return out;
  const lr=await DB.from('gym_links').select('a,b').or(`a.eq.${S.friendCode},b.eq.${S.friendCode}`);
  if(lr.error)throw lr.error;
  const others=(lr.data||[]).map(l=>l.a===S.friendCode?l.b:l.a);
  for(const code of others){const r=await DB.rpc('gym_friend_status',{friend_code:code});if(r.error)throw r.error;
    if(r.data?.length)out.push({...r.data[0],code});else out.push({code,name:t('غير متاح','Unavailable'),day:t('صاحب الكود مش مشارك حالياً','This code is not sharing right now')});}
  return out;
}

/* ---------- views ---------- */
const view = document.getElementById("view");
const navbar = document.getElementById("navbar");
let nav = "home";

const NAV_LABELS = { home:["الرئيسية","Home"], lib:["التمارين","Exercises"], friends:["الشلة","Crew"], inbody:["InBody","InBody"], diet:["الأكل","Food"], settings:["الإعدادات","Settings"] };
function render(){
  applyLang();
  if(!S.lang){ renderLangPick(); return; }
  [...navbar.children].forEach(b=>{ b.classList.toggle("on", b.dataset.v===nav);
    const x = NAV_LABELS[b.dataset.v]; if(x){ const nl=b.querySelector(".nl"); if(nl) nl.textContent=t(x[0],x[1]); } });
  if(!S.name || !S.split){ renderOnboard(); navbar.classList.add("hide"); return; }
  navbar.classList.remove("hide");
  if(nav==="home") renderHome();
  else if(nav==="lib") renderLib();
  else if(nav==="friends") renderFriends();
  else if(nav==="inbody") renderInbody();
  else if(nav==="diet") renderDiet();
  else renderSettings();
}

let onboardSplit = "arnold";
function renderOnboard(){
  view.innerHTML = `
    <div class="center" style="margin-top:18px"><span class="brand">الجامد</span> <div class="eyebrow" style="margin-top:14px">LIFT. LOG. REPEAT.</div></div>
    <p class="sub center" style="margin-top:6px">${t("سجل تمرينك وأوزانك، والتطبيق يفكرك كل يوم عليك إيه.","Log your workouts and weights, and the app keeps track of what's on each day.")}</p>
    <div class="card">
      <label>${t("اسمك","Your name")}</label>
      <input type="text" id="nm" placeholder="${t("اكتب اسمك","Type your name")}" value="${esc(S.name)}">
      <label>${t("اختار نظام التمرين","Pick your workout split")}</label>
      ${Object.entries(SPLITS).map(([k,sp])=>`
        <div class="split-card ${k===onboardSplit?'sel':''}" data-k="${k}">
          <b>${esc(spName(sp))}</b><span>${esc(spDesc(sp))}</span>
        </div>`).join("")}
      <div style="margin-top:16px"><button class="btn" id="start">${t("يلا نبدأ 💪","Let's go 💪")}</button></div>
      <p class="note" style="margin-top:12px">${t("بياناتك بتتحفظ على موبايلك بس — مفيش حسابات ولا تسجيل.","Your data is stored on your phone only — no accounts, no sign-up.")}</p>
    </div>`;
  view.querySelectorAll(".split-card").forEach(c=>{
    c.onclick = ()=>{ onboardSplit = c.dataset.k;
      view.querySelectorAll(".split-card").forEach(x=>x.classList.toggle("sel", x===c)); };
  });
  view.querySelector("#start").onclick = ()=>{
    const nm = view.querySelector("#nm").value.trim();
    if(!nm || nm.length>50){ toast(t("اكتب اسمك الأول","Type your name first")); return; }
    S.name = nm; S.split = onboardSplit; S.dayIndex = 0; save();
    pushMyStatusUpsert();
    nav="home"; render(); window.scrollTo(0,0); toast(t("يلا يا جامد","Let's go, beast"));
  };
}

function dayPartsLabel(p){
  let lbl = G(p[0]);
  if(p[1]==="biceps") lbl += t(" (باي)"," (Biceps)");
  if(p[1]==="triceps") lbl += t(" (تراي)"," (Triceps)");
  return lbl;
}


let calM=null;
function ymKey(y,m){return y+"-"+String(m+1).padStart(2,"0");}
function calendarCard(){
  const now=new Date(); if(!calM) calM={y:now.getFullYear(),m:now.getMonth()};
  const {y,m}=calM, key=ymKey(y,m);
  const days=new Set(S.history.filter(h=>h&&typeof h.date==="string"&&h.date.startsWith(key+"-")).map(h=>h.date));
  const first=new Date(y,m,1), n=new Date(y,m+1,0).getDate();
  const off=(first.getDay()+1)%7; // week starts Saturday
  const names=curLang()==="ar" ? ["ش","ح","ن","ث","ر","خ","ج"] : ["Sa","Su","Mo","Tu","We","Th","Fr"];
  const mn=curLang()==="ar" ? ["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"] : ["January","February","March","April","May","June","July","August","September","October","November","December"];
  let cells=names.map(x=>`<div class="cal-w">${x}</div>`).join("")+'<div class="cal-d e"></div>'.repeat(off);
  for(let d=1;d<=n;d++){const ds=key+"-"+String(d).padStart(2,"0");cells+=`<div class="cal-d ${days.has(ds)?"on":""} ${ds===todayStr()?"td":""}" data-d="${ds}">${days.has(ds)?"✓":d}</div>`;}
  const isNow=y===now.getFullYear()&&m===now.getMonth(), c=days.size;
  const txt=curLang()==="ar"
    ? (c===0?(isNow?"لسه منزلتش":"منزلتش"):c===1?"نزلت مرة واحدة":c===2?"نزلت مرتين":"نزلت "+c+(c<=10?" مرات":" مرة"))
    : (c===0?"No workouts":"Worked out "+c+(c===1?" time":" times"));
  const cnt=curLang()==="ar" ? `(${c} يوم)` : `(${c} ${c===1?"day":"days"})`;
  return `<div class="card" id="calcard"><div class="cal-h"><button id="calnext" aria-label="${t("الشهر الجاي","Next month")}" ${isNow?"disabled":""}>›</button><b>${mn[m]} ${y}</b><button id="calprev" aria-label="${t("الشهر اللي فات","Previous month")}">‹</button></div><div class="cal-g">${cells}</div><div class="cal-cnt">${txt} ${isNow?t("الشهر ده","this month"):t("في الشهر ده","that month")} 💪 <span class="mut" style="font-weight:600">${cnt}</span></div></div>`;
}
function bindCalendar(){
  const pv=view.querySelector("#calprev"), nx=view.querySelector("#calnext");
  if(pv) pv.onclick=()=>{calM.m--; if(calM.m<0){calM.m=11;calM.y--;} render();};
  if(nx) nx.onclick=()=>{calM.m++; if(calM.m>11){calM.m=0;calM.y++;} render();};
}
function openExercise(id){
  const e=EXERCISES.find(x=>x.id===id); if(!e) return;
  libGroup=e.group; libSub=''; libQuery=''; nav='lib'; render();
  const c=view.querySelector('.ex[data-id="'+(window.CSS&&CSS.escape?CSS.escape(id):id)+'"]');
  if(c){ c.classList.add('hl'); c.scrollIntoView({block:'start'}); window.scrollBy(0,-12); setTimeout(()=>c.classList.remove('hl'),4000); }
}
function renderHome(){
  const sp = SPLITS[S.split];
  const doneToday = S.lastDone === todayStr();
  const isFree = S.split==="free";
  const day = isFree ? {label:"تمرين حر", labelEn:"Free Workout", parts:[]} : sp.days[S.dayIndex % sp.days.length];
  const lastHist = S.history.length ? S.history[S.history.length-1] : null;
  const st = streak();

  let main;
  if(doneToday){
    main = `
      <div class="done-card">
        <div class="plate">DONE</div>
        <div class="big">${t("خلصت تمرين النهاردة، جامد!","Today's workout done, beast!")}</div>
        <div class="mut" style="font-size:14px;margin-top:4px;position:relative">${t("تمرينك الجاي:","Next up:")} <b style="color:#93c5fd">${isFree?t("تمرين حر — اللي تحبه","Free Workout — your call"):esc(dayLbl(day))}</b></div>
        <div class="rowbtns">
          <button class="btn small ghost" id="undone">${t("تراجع عن الصح","Undo the ✓")}</button>

        </div>
      </div>`;
  } else if(isFree){
    main = `
      <div class="hero">
        <div class="eyebrow">TODAY / YOUR RULES</div><div class="kicker">${t("تمرين النهاردة","Today's workout")}</div>
        <div class="big">${t("تمرين حر","Free Workout")}</div>
        <div class="chips">${S.freeSel.length?S.freeSel.map(g=>`<span class="chip">${esc(G(g))}</span>`).join(""):`<span class="chip" style="opacity:.55">${t("لسه مختارتش عضلات","No muscles picked yet")}</span>`}</div>
        <button class="check" id="done" title="${t("خلصت","Done")}">✓</button>
        <div class="mut" style="font-size:12px;position:relative">${t("اختار عضلاتك تحت ودوس صح لما تخلص","Pick your muscles below and hit ✓ when done")}</div>
      </div>
      <div class="card">

        <div style="margin-top:9px">${day.parts.map(p=>exByGroup(p[0],p[1]).slice(0,4).map(e=>`<button class="plan-ex" data-ex="${esc(e.id)}"><b style="font-weight:700">• ${esc(exName(e))}</b><span>${t("شوف الصورة والفيديو ‹","Photo &amp; video ›")}</span></button>`).join("")).join("")}</div>
        <div class="mut" style="font-size:12px;margin-top:7px">${t("دوس على أي تمرين متعرفوش وهيفتحلك صورته وفيديو الأداء. دي مش خطة تدريب كاملة. استريح حسب جدولك ومدربك.","Tap any exercise you don't know to open its photo and demo video. This is not a complete training plan. Rest according to your schedule and coach.")}</div>
      </div>`;
  }

  const week = sp.days.map((d,i)=>{
    const cls = i===S.dayIndex%sp.days.length && !doneToday ? "today" : "";
    return `<div class="wday ${cls}">${t("يوم","Day")} ${i+1}<b>${esc(dayLbl(d))}</b></div>`;
  }).join("");

  view.innerHTML = `
    <div class="brandline"><span class="brand">الجامد</span><small>BUILT BY REPS.</small><button class="langbtn" id="langsw">${t("EN","عربي")}</button></div><h1>${t("جاهز يا ","Ready, ")}${esc(S.name)}${t("؟","?")}</h1>
    <p class="sub">${esc(spName(sp))}${lastHist ? t(" · آخر تمرين: "," · Last: ")+esc(lastHist.day)+" ("+dayAgo(lastHist.date)+")" : ""}</p>
    ${st>1 ? `<div style="margin-bottom:12px"><span class="streak">🔥 ${st} ${t("أيام ورا بعض","days in a row")}</span></div>` : ""}

  });
  const doneBtn = view.querySelector("#done");
  if(doneBtn) doneBtn.onclick = ()=>{
    if(isFree && !S.freeSel.length){ toast(t("اختار عضلة واحدة على الأقل الأول","Pick at least one muscle first")); return; }
    calM=null;
    S.history.push({date: todayStr(), day: isFree ? t("تمرين حر: ","Free: ")+S.freeSel.map(g=>G(g)).join(t(" + "," + ")) : dayLbl(day)});
    S.lastDone = todayStr();
    if(!isFree) S.dayIndex = (S.dayIndex+1) % sp.days.length;
    save(); pushMyStatusUpsert(); render(); toast(isFree ? t("جامد ✅","Beast ✅") : t("جامد ✅ تمرينك الجاي: ","Beast ✅ Next up: ")+dayLbl(sp.days[S.dayIndex%sp.days.length]));
  };
  const undone = view.querySelector("#undone");
  if(undone) undone.onclick = ()=>{
    S.lastDone = null;
    if(!isFree) S.dayIndex = (S.dayIndex-1+sp.days.length) % sp.days.length;
    if(S.history.length) S.history.pop();
    save(); pushMyStatusUpsert(); render();
  };
  const sk = view.querySelector("#skip");
  if(sk) sk.onclick = ()=>{
    S.dayIndex = (S.dayIndex+1) % sp.days.length;
    save(); pushMyStatusUpsert(); render(); toast(t("اتنقلنا لـ: ","Moved to: ")+dayLbl(sp.days[S.dayIndex%sp.days.length]));
  };
}

let libGroup = "chest", libQuery = "", libSub = "", libAll = true;
function exCard(e){

  const hist = S.log[e.id] || [];

  const img = e.frames.length>1
    ? `<img class="anim" data-f0="${e.frames[0]}" data-f1="${e.frames[1]}" src="${e.frames[0]}" alt="${esc(nm)}" loading="lazy">`

  const subLbl = e.group==='arms'&&e.sub ? (e.sub==="biceps"?t("باي","Biceps"):e.sub==="triceps"?t("تراي","Triceps"):t("ساعد","Forearms")) : "";

    ${vNote?`<p class="mut" style="font-size:12px;margin:6px 0">${esc(vNote)}</p>`:''}
    <div class="logrow">
      <div class="fld"><label>${t("الوزن (كجم)","Weight (kg)")}</label><input type="number" inputmode="decimal" class="w" placeholder="0"></div>
      <div class="fld"><label>${t("العدات","Reps")}</label><input type="number" inputmode="numeric" class="r" placeholder="0"></div>
      <div class="fld"><label>${t("المجموعات","Sets")}</label><input type="number" inputmode="numeric" class="s" placeholder="3"></div>
      <button class="logsave">${t("سجل","Log")}</button>
    </div>
    ${last ? `<div class="last">${t("آخر مرة:","Last time:")} ${esc(last.w)} ${t("كجم","kg")} × ${esc(last.r)} ${t("عدات","reps")}${last.s?` × ${esc(last.s)} ${t("مجموعات","sets")}`:""} — ${dayAgo(last.d)}</div>` : `<div class="mut" style="font-size:12px;margin-top:9px">${t("لسه مسجلتش التمرين ده","Not logged yet")}</div>`}

      <div class="hist">${hist.slice(-5).reverse().map(h=>`${dayAgo(h.d)}: ${esc(h.w)}${t("كجم","kg")} × ${esc(h.r)}${h.s?` × ${esc(h.s)}`:""}`).join("<br>")}</div>`:""}
  </div>`;
}

function renderExList(){
  const q=libQuery.trim().toLowerCase().replace(/[أإآ]/g,'ا').replace(/ة/g,'ه');
  const norm=t=>t.toLowerCase().replace(/[أإآ]/g,'ا').replace(/ة/g,'ه');
  const rows=exByGroup(libGroup).filter(e=>(!libSub||(e.tags||[]).includes(libSub))&&(!q||norm(e.ar+' '+e.en+' '+(e.tags||[]).join(' ')).includes(q)));
  view.querySelector('#excount').textContent=rows.length+t(' تمرين ظاهر في ',' shown in ')+G(libGroup)+(q?t(' · البحث في كل التمارين',' · searching all exercises'):'');
  view.querySelector('#exlist').innerHTML=rows.length?rows.map(exCard).join(''):`<p class="note">${t("مفيش نتيجة هنا. جرب اسم تاني أو فلتر عضلة تاني.","No results here. Try another name or muscle filter.")}</p>`;
  bindExCards();
}

let animTimer;
function bindExCards(){
  clearInterval(animTimer);
  let frame = false;
  animTimer = setInterval(()=>{frame=!frame; document.querySelectorAll(".anim").forEach(img=>img.src=frame?img.dataset.f1:img.dataset.f0);},1200);
  view.querySelectorAll(".ex").forEach(card=>{
    const id = card.dataset.id;
    card.querySelector(".logsave").onclick = ()=>{
      const w = card.querySelector(".w").value.trim();
      const r = card.querySelector(".r").value.trim();
      const s = card.querySelector(".s").value.trim();
      if(w==="" || !Number.isFinite(+w) || +w<0 || !Number.isInteger(+r) || +r<1 || (s && (!Number.isInteger(+s)||+s<1))){ toast(t("اكتب الوزن والعدات الأول","Enter weight and reps first")); return; }
      (S.log[id] = S.log[id]||[]).push({d: todayStr(), w:w, r:r, s:s||null});
      save(); render(); toast(t("اتسجل ✅","Logged ✅"));
    };
    const tg = card.querySelector(".hist-toggle");
    if(tg) tg.onclick = ()=>card.classList.toggle("open");
  });
}

async function renderFriends(){
  view.innerHTML=`<div class="brandline"><span class="brand">${t("الشلة","The Crew")}</span><small>TRAIN TOGETHER</small></div>
    <p class="sub">${t("شارك اسمك ونوع تمرينك بس. الأوزان وسجل التدريب مش بيطلعوا من جهازك.","Share only your name and workout type. Your weights and training log never leave your device.")}</p>`;
  if(!DB){view.innerHTML+=`<div class="card">${t("المشاركة مش متاحة حالياً، سجلك الشخصي شغال.","Sharing isn't available right now; your personal log still works.")}</div>`;return;}
  if(!S.sharing){view.innerHTML+=`<div class="card"><h2>${t("نتمرن سوا؟","Train together?")}</h2><p class="note">${t("لما تفعل المشاركة، Supabase هيحفظ اسمك ونوع يومك وتاريخ تحديثه. اللي تضيفه بكوده يشوفهم، وهو كمان بيشوفك عنده تلقائي. مفيش بحث بالاسم ولا قائمة عامة. تقدر توقف المشاركة وتمسحها في أي وقت.","When you turn sharing on, Supabase stores your name, your workout type and its update date. Anyone you add by code sees them, and they automatically see you back. No name search and no public list. You can stop sharing and erase it anytime.")}</p><button class="btn" id="enableShare">${t("موافق، فعّل المشاركة","Agree, turn sharing on")}</button></div>`;
    view.querySelector('#enableShare').onclick=async()=>{S.sharing=true;save();const ok=await pushMyStatusUpsert();if(!ok){S.sharing=false;save();toast(t('المشاركة متوصلتش، جرب تاني',"Couldn't connect sharing, try again"));}renderFriends();};return;}
  view.innerHTML+=`<div class="card"><b>${t("كودك، ابعته بس لأصحابك","Your code — send it only to your friends")}</b><div class="codebox" id="mycode" style="margin:12px 0">${t("بيجهز...","Loading...")}</div>
    <button class="btn ghost" id="share">${t("انسخ الكود","Copy code")}</button><p class="mut" id="sync" style="font-size:12px"></p></div>
    <div class="card"><label>${t("كود صاحبك","Your friend's code")}</label><input type="text" id="fc" placeholder="${t("الصق الكود هنا","Paste the code here")}" dir="ltr"><button class="btn" id="add" style="margin-top:10px">${t("ضيف صاحبك","Add your friend")}</button><p class="mut" style="font-size:12px;margin-top:8px">${t("أول ما تضيفه هيظهر عندك، وانت كمان هتظهر في الشلة عنده تلقائي. أي واحد فيكم يقدر يشيل التاني.","Once you add him he shows up here, and you automatically show up in his crew too. Either of you can remove the other.")}</p></div>
    <div class="card"><b>${t("الشلة عليهم إيه؟","What's the crew up to?")}</b><button class="btn small ghost" id="refresh">${t("تحديث","Refresh")}</button><div id="flist" style="margin-top:12px">${t("بيحمّل...","Loading...")}</div></div>
    <button class="btn danger" id="disableShare">${t("إيقاف المشاركة ومسح حالتي","Stop sharing and erase my status")}</button>`;
  view.querySelector('#share').onclick=async()=>{if(!S.friendCode)return;try{await navigator.clipboard.writeText(S.friendCode);toast(t('الكود اتنسخ','Code copied'));}catch(e){toast(t('حدد الكود وانسخه','Select the code and copy it'));}};
  view.querySelector('#refresh').onclick=renderFriends;
  view.querySelector('#add').onclick=async()=>{const c=view.querySelector('#fc').value.trim().toLowerCase();
    if(!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/.test(c)){toast(t('الكود مش كامل','The code is incomplete'));return;}
    if(c===S.friendCode){toast(t('ده كودك انت',"That's your own code"));return;}
    try{await identity();const r=await DB.rpc('gym_friend_status',{friend_code:c});if(r.error||!r.data?.length){toast(t('الكود مش موجود أو المشاركة واقفة','Code not found or sharing is off'));return;}
      await linkFriend(c);toast(t('اتضاف، وانت كمان ظهرت عنده','Added, and you show up on their side too'));renderFriends();}catch(e){toast(t('مفيش اتصال، جرب تاني','No connection, try again'));}};
  view.querySelector('#disableShare').onclick=async()=>{if(!confirm(t('تمسح حالتك من النت وتوقف المشاركة؟','Erase your status online and stop sharing?')))return;
    try{const uid=await identity();await unlinkAll();const r=await DB.from('gym_status').delete().eq('owner_id',uid);if(r.error)throw r.error;
      S.sharing=false;S.friendCode=null;save();renderFriends();}catch(e){toast(t('المسح متعملش، اتصل بالنت وجرب تاني',"Couldn't erase, connect and try again"));}};
  const ok=await pushMyStatusUpsert();if(nav!=='friends'||!document.querySelector('#mycode'))return;
  view.querySelector('#mycode').textContent=S.friendCode||t('تعذر الاتصال','Connection failed');
  view.querySelector('#sync').textContent=ok?t('حالتك اتحدثت دلوقتي','Your status was updated just now'):t('التحديث متعملش، اتصل بالنت وجرب تاني',"Couldn't update, connect and try again");
  try{const rows=await fetchFriends();if(nav!=='friends'||!document.querySelector('#mycode'))return;
    view.querySelector('#flist').innerHTML=rows.length?rows.map(r=>`<div class="friend"><div class="n">${esc(r.name)}</div><span class="badge ${r.status_date===todayStr()?'':'off'}">${r.status_date===todayStr()?esc(r.day):t('آخر حالة: ','Last: ')+esc(r.day)}</span><p class="mut" style="font-size:11px">${r.status_date===todayStr()?t('محدث النهاردة','Updated today'):r.status_date?t('مش متأكدين من تمرين النهاردة، آخر تحديث ',"Not sure about today's workout, last update ")+esc(r.status_date):t('المشاركة واقفة','Sharing off')}</p><button class="hist-toggle" data-remove="${r.code}">${t('إزالة من الشلة','Remove from crew')}</button></div>`).join(''):t('لسه مضفتش حد. خد كود صاحبك وضيفه، وهيظهر عنده تلقائي.',"No one added yet. Get your friend's code and add him, and you'll show up on his side automatically.");
    view.querySelectorAll('[data-remove]').forEach(b=>b.onclick=async()=>{try{await unlinkFriend(b.dataset.remove);renderFriends();}catch(e){toast(t('الإزالة متعملتش، اتصل بالنت وجرب تاني',"Couldn't remove, connect and try again"));}});
  }catch(e){if(nav==='friends'&&view.querySelector('#flist'))view.querySelector('#flist').textContent=t('التحديث مش متاح، جرب تاني.','Update unavailable, try again.');}
}

const IB_FIELDS=[

  ["protein","البروتين","Protein","كجم","kg","up"],
  ["minerals","المعادن","Minerals","كجم","kg","up"],
  ["visceral","الدهون الحشوية","Visceral fat","مستوى","lvl","down"],
  ["bmr","الحرق الأساسي BMR","BMR","سعر","kcal","neu"],
  ["score","درجة InBody","InBody score","نقطة","pts","up"],
];
function r1(x){ return Math.round(x*10)/10; }
let ibCompare="prev";
function renderInbody(){
  const list=(S.inbody||[]).slice().sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
  let report="";

    const latest=list[list.length-1];

    const rows=IB_FIELDS.filter(([k])=>latest[k]!=null && base[k]!=null).map(([k,nm,nmEn,unit,unitEn,kind])=>{
      const o=+base[k], nw=+latest[k], d=r1(nw-o);
      const pct=o!==0?r1(d/o*100):null;
      const up=d>0;
      const cls=d===0?"neu":(kind==="neu"?"neu":((kind==="up")===up?"good":"bad"));

      <div class="tabs" style="margin-top:10px"><button class="tab ${ibCompare==="prev"?"on":""}" data-ib="prev">${t("باللي قبلها","vs previous")}</button><button class="tab ${ibCompare==="first"?"on":""}" data-ib="first">${t("بأول قراءة","vs first")}</button></div>

      <p class="mut" style="font-size:11.5px;margin-top:10px;line-height:1.8">${t("🟢 أخضر = تحسن · 🔴 أحمر = تراجع · 🔵 أزرق = متابعة من غير حكم. العضلات والمية والبروتين والدرجة: الزيادة كويسة. الدهون ونسبتها والحشوية: النقص كويس.","🟢 Green = improving · 🔴 Red = declining · 🔵 Blue = tracking, no judgment. Muscle, water, protein and score: up is good. Fat mass, fat % and visceral: down is good.")}</p>
    </div>`;
  } else if(list.length===1){
    report=`<div class="card"><b style="font-size:14px;font-weight:800">${t("أول قراءة اتسجلت ✅","First reading saved ✅")}</b><p class="note" style="margin-top:8px">${t("سجل قراءة تانية بعد فترة وهيطلعلك هنا تقرير بالفرق: زدت ولا خسيت في الوزن والعضلات والدهون، بالأرقام والنسب.","Log another reading later and you'll get a report here with the difference: what you gained or lost in weight, muscle and fat, with numbers and percentages.")}</p></div>`;
  }
  const formCard=`<div class="card"><b style="font-size:14px;font-weight:800">${t("سجل قراءة جديدة","Log a new reading")}</b>
    <label>${t("التاريخ","Date")}</label><input type="date" id="ibdate" value="${todayStr()}">
    <div class="ib-grid">
      ${IB_FIELDS.map(([k,nm,nmEn,unit,unitEn])=>`<div class="fld"><label>${t(nm,nmEn)}${t(unit,unitEn)?" ("+t(unit,unitEn)+")":""}</label><input type="number" inputmode="decimal" step="any" data-ibf="${k}" placeholder="—"></div>`).join("")}
    </div>
    <label>${t("ملاحظة (اختياري)","Note (optional)")}</label><input type="text" id="ibnote" placeholder="${t("مثلاً: بعد شهر تضخيم","e.g. after a bulking month")}">
    <button class="btn" id="ibsave" style="margin-top:14px">${t("سجل القراءة","Save reading")}</button>
    <p class="note" style="margin-top:10px">${t("املأ اللي موجود في ورقة الجهاز بس وسيب الباقي فاضي. لو سجلت قراءة بنفس التاريخ هتتبدل بالجديدة.","Fill only what's on the machine printout and leave the rest empty. A reading on the same date replaces the old one.")}</p></div>`;
  const hist=list.slice().reverse().map(e=>`<div class="friend"><div><div class="n">${dayAgo(e.date)} <span class="mut" style="font-size:11px">${esc(e.date)}</span></div><div class="d">${IB_FIELDS.filter(([k])=>e[k]!=null).slice(0,4).map(([k,nm,nmEn,u,uEn])=>t(nm,nmEn)+" "+e[k]+(t(u,uEn)?" "+t(u,uEn):"")).join(" · ")}${e.note?" · "+esc(e.note):""}</div></div><button class="hist-toggle" data-ibdel="${esc(e.date)}">${t("مسح","Delete")}</button></div>`).join("");
  view.innerHTML=`<h1>InBody <span class="mut" style="font-size:17px">${t("تتبع جسمك ⚖","Track your body ⚖")}</span></h1>
    <p class="sub">${t("سجل قراءة جهاز InBody بالتاريخ، وأول ما تضيف قراءة جديدة هتتقارن باللي قبلها: زدت ولا خسيت، عضلات ودهون وكل التفاصيل بالفرق والنسبة.","Log your InBody scan readings by date, and each new one gets compared to the previous: what you gained or lost — muscle, fat and every detail, with differences and percentages.")}</p>
    ${report}
    ${formCard}

    <p class="note">${t("القراءات دي على موبايلك بس — مش بتتشارك مع الشلة ولا بتطلع على النت، وبتدخل في النسخة الاحتياطية.","These readings stay on your phone only — not shared with the crew or sent online, and they're included in backups.")}</p>`;
  view.querySelectorAll("[data-ib]").forEach(b=>b.onclick=()=>{ ibCompare=b.dataset.ib; renderInbody(); });
  view.querySelector("#ibsave").onclick=()=>{
    const date=view.querySelector("#ibdate").value||todayStr();
    if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){ toast(t("التاريخ مش مظبوط","Invalid date")); return; }
    const e={date}; let n=0;

  };

/* ---------- Month meal planner: device-local, no network calls ---------- */
let dietWeek=0;
function validDietImport(d){
 if(!d||typeof d!=="object")return null;
 const p={height:Number(d.height),weight:Number(d.weight),age:d.age===null?null:Number(d.age),bmr:d.bmr===null?null:Number(d.bmr),start:String(d.start||""),sex:["m","f"].includes(d.sex)?d.sex:"",activity:["low","light","moderate"].includes(d.activity)?d.activity:"low",food:d.food==="veg"?"veg":"mixed",goal:["lose","gain"].includes(d.goal)?d.goal:"balance",adult:d.adult===true,medical:d.medical===true,done:Array.isArray(d.done)?d.done.slice(0,30).map(x=>x===true):[]};
 return dietValidate(p)?null:p;
}
function dietDate(start,n){const d=new Date(start+'T12:00:00');d.setDate(d.getDate()+n);return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');}
function dietValidate(p){
 if(!p.adult||p.medical) return t('الخطة العامة للبالغين الأصحاء فقط. لو أقل من 18 سنة، أو في حمل/رضاعة، أو حساسية أكل، أو مرض مزمن/أدوية مؤثرة، أو اضطراب أكل: راجع دكتور أو أخصائي تغذية لخطة تناسبك.','This general plan is for healthy adults only. Under 18, pregnancy/breastfeeding, food allergies, chronic conditions/medicines affecting diet, or an eating disorder need a clinician or dietitian.');
 if(!Number.isFinite(p.height)||p.height<120||p.height>230||!Number.isFinite(p.weight)||p.weight<35||p.weight>250)return t('راجع الطول (120–230 سم) والوزن (35–250 كجم).','Check height (120–230 cm) and weight (35–250 kg).');
 if(p.weight/((p.height/100)**2)<18.5) return t('وزنك بالنسبة لطولك محتاج تقييم فردي قبل خطة عامة. الأفضل أخصائي تغذية، مش خطة تخسيس تلقائية.','Your weight for your height needs individual assessment before a general plan. See a dietitian rather than using an automatic weight-loss plan.');
 if(p.age!==null&&(!Number.isInteger(p.age)||p.age<18||p.age>100))return t('اكتب عمر صحيح من 18 إلى 100 أو سيبه فاضي.','Enter a whole age from 18 to 100 or leave it blank.');
 if(p.bmr!==null&&(!Number.isFinite(p.bmr)||p.bmr<800||p.bmr>3000))return t('راجع BMR من ورقة الجهاز (800–3000) أو سيبه فاضي.','Check the BMR from the scan (800–3000), or leave it blank.');
 if(!/^\d{4}-\d{2}-\d{2}$/.test(p.start)||Number.isNaN(new Date(p.start+'T12:00:00').getTime()))return t('اختار تاريخ بداية صحيح.','Choose a valid start date.');
 return '';
}
function dietEnergy(p){
 const resting=p.bmr||(p.age&&['m','f'].includes(p.sex)?10*p.weight+6.25*p.height-5*p.age+(p.sex==='m'?5:-161):null);
 if(!resting)return null;
 const mult={low:1.2,light:1.375,moderate:1.55}[p.activity]||1.2;
 return {resting:Math.round(resting),maintenance:Math.round(resting*mult/50)*50,source:p.bmr?'scan':'equation',mult};
}
function dietMeals(p,n){
 const veg=p.food==='veg',week=Math.floor(n/7),i=(n+week)%7;
 const breakfast=[
 ['2 بيضة + نصف رغيف بلدي + خيار وطماطم','2 eggs + half a baladi flatbread + cucumber and tomato'],
 ['كوب فول مطبوخ + نصف رغيف بلدي + سلطة','1 cup cooked fava beans + half a baladi flatbread + salad'],

 const snack=['ثمرة فاكهة + كوب زبادي سادة. وزّع 5 حصص على الأقل من الفاكهة والخضار على اليوم.','A piece of fruit + 1 cup plain yoghurt. Spread at least 5 portions of fruit and vegetables across the day.'];
 return [breakfast[i],(veg?lunchVeg:lunchMixed)[i],dinner[(i+week)%7],snack];
}
function dietGoal(p){return p.goal==='gain'?t('لو هدفك زيادة الوزن: ممكن تضيف وجبة خفيفة من لبن وشوفان أو ساندوتش جبنة لو محتاج، وراجع وزنك وأداءك بعد أسبوعين. مش وعد بزيادة عضل.','For weight gain, you can add a milk-and-oats snack or a cheese sandwich if needed, then review weight and performance after two weeks. This does not promise muscle gain.'):p.goal==='lose'?t('لو هدفك تقليل الوزن: ابدأ بوجبات منتظمة وقلل المشروبات المحلاة والحلويات المتكررة، من غير تجويع أو حذف وجبات. الكميات هنا نقطة بداية عامة، مش عجز سعرات محسوب.','For weight loss, start with regular meals and reduce sugary drinks and frequent sweets, without starvation or skipping meals. These portions are a general starting point, not a calculated calorie deficit.'):t('للتوازن: حافظ على وجبات منتظمة، وعدّل الكميات حسب الشبع والنشاط وتغيّر الوزن.','For balance, keep meals regular and adjust portions to appetite, activity and weight trend.');}
function dietPlanText(p){
 let out=[t('الجامد | خطة أكل 30 يوم','El Gamed | 30-day meal outline'),p.start+' → '+dietDate(p.start,29),t('خطة عامة وليست وصفة طبية أو جدول سعرات محسوب.','General guidance, not medical advice or a calorie-matched menu.'),dietGoal(p)];
 for(let n=0;n<30;n++){out.push('\n'+t('اليوم ','Day ')+(n+1)+' | '+dietDate(p.start,n));dietMeals(p,n).forEach((m,i)=>out.push(t(['الفطار','الغدا','العشا','سناك'][i],['Breakfast','Lunch','Dinner','Snack'][i])+': '+t(...m)));}
 return out.join('\n');
}
function renderDiet(){
 const p=S.diet||{},energy=p.start?dietEnergy(p):null;
 const last=(S.inbody||[]).filter(x=>Number.isFinite(+x.weight)&&+x.weight>0).slice().sort((a,b)=>a.date.localeCompare(b.date)).pop();
 const field=(id,ar,en,value,min,max)=>`<div><label for="${id}">${t(ar,en)}</label><input id="${id}" type="number" inputmode="decimal" step="any" min="${min}" max="${max}" value="${esc(String(value??''))}"></div>`;
 const opts=(id,ar,en,vals,val)=>`<label for="${id}">${t(ar,en)}</label><select id="${id}">${vals.map(([v,a,e])=>`<option value="${v}" ${v===val?'selected':''}>${t(a,e)}</option>`).join('')}</select>`;
 let plan='';
 if(p.start&&!dietValidate(p)){
 const start=dietWeek*7,end=Math.min(start+7,30);
 plan=`<section class="card diet-hero"><div class="eyebrow">30 ${t('يوم • خطتك المحفوظة','DAYS • SAVED OUTLINE')}</div><h2>${t('أكلك مرتب للشهر','Your month, planned')}</h2><p class="note">${esc(p.start)} → ${dietDate(p.start,29)} · <span id="diet-progress">${p.done?.filter(Boolean).length||0}/30</span> ${t('يوم اتعمل','days checked')}</p><p>${dietGoal(p)}</p><p class="note">${t('وجبات منزلية مقترحة، مش نظام علاجي ولا جدول موزون مطابق لسعراتك. الشهور مختلفة، الخطة مدتها 30 يوم.','Suggested home meals, not a therapeutic diet or a weighed menu matching your calories. This outline spans 30 days, not a calendar month.')}</p></section>
 ${energy?`<div class="card"><b>${t('تقدير للطاقة، مش هدف ملزم','Energy estimate, not a prescription')}</b><div class="diet-energy">≈ ${energy.maintenance} <small>${t('سعر/يوم للمحافظة','kcal/day maintenance')}</small></div><p class="note">${energy.source==='scan'?t('BMR المدخل من الجهاز','Entered scan BMR'):'Mifflin–St Jeor'}: ${energy.resting} × ${energy.mult}. ${t('الحرق الأساسي لوحده مش أكلك اليومي. ده تقدير ممكن يزيد أو يقل بوضوح؛ الوجبات تحت مش محسوبة للوصول للرقم ده.','Resting energy alone is not your daily food allowance. This is an uncertain estimate; the meals below are not calculated to hit this number.')}</p></div>`:`<p class="note">${t('من الطول والوزن بس نقدر نرتب وجبات عامة، مش نحدد سعرات دقيقة. تقدير الطاقة اختياري بإضافة العمر والجنس والنشاط، أو BMR من الجهاز.','Height and weight alone support a general meal outline, not precise calories. Optionally add age, sex and activity, or scan BMR, for an energy estimate.')}</p>`}
 <div class="diet-weeks" role="group" aria-label="${t('الأسابيع','Weeks')}">${[0,1,2,3,4].map(w=>`<button class="tab ${w===dietWeek?'on':''}" data-dw="${w}">${t('أسبوع ','Week ')}${w+1}</button>`).join('')}</div>
 <p class="note">${t('الكوب حوالي 240 مل. الأرز والمكرونة والبقول بعد الطبخ؛ الشوفان جاف. كف البروتين بعد الطبخ ومن غير عضم. أضف زيت نباتي بكمية صغيرة، وكُل خضار بألوان مختلفة.','A cup is about 240 ml. Rice, pasta and pulses are cooked; oats are dry. A protein palm is cooked and boneless. Use small amounts of unsaturated oil and vary vegetable colours.')}</p>
 ${Array.from({length:end-start},(_,j)=>{let n=start+j;return `<details class="card diet-day" ${j===0?'open':''}><summary><span>${t('اليوم ','Day ')}${n+1}<small>${dietDate(p.start,n)}</small></span><span>${p.done?.[n]?'✓':'+'}</span></summary><div class="diet-meals">${dietMeals(p,n).map((m,i)=>`<div><b>${t(['الفطار','الغدا','العشا','سناك'][i],['Breakfast','Lunch','Dinner','Snack'][i])}</b><p>${t(...m)}</p></div>`).join('')}</div><label class="diet-check"><input type="checkbox" data-dd="${n}" ${p.done?.[n]?'checked':''}>${t('خلصت اليوم','Day completed')}</label></details>`;}).join('')}
 <div class="card"><h3>${t('جهّز للأسبوع','Weekly prep')}</h3><p class="note">${t('اختار من البقول، البيض، اللبن والزبادي والجبنة القريش، ومعاهم فراخ وسمك لو بتاكلهم. هات شوفان وعيش حبوب كاملة وأرز وبطاطس وخضار وفاكهة متنوعة. الكميات حسب الأيام وعدد الأشخاص، مش قائمة شراء محسوبة.','Choose pulses, eggs, milk, plain yoghurt and cottage cheese, plus chicken and fish if you eat them. Get oats, wholegrain bread, rice, potatoes and varied produce. Quantities depend on the days and number of people; this is not a calculated shopping list.')}</p><p class="note">${t('راجع الخطة بعد أسبوعين: الجوع، الطاقة، الأداء ومتوسط الوزن. لو دوخة أو إرهاق مستمر، وقف أي تقليل وراجع مختص. مفيش نزول وزن مضمون.','Review after two weeks: hunger, energy, training and average weight. If dizziness or ongoing fatigue develops, stop restriction and seek professional advice. No weight change is guaranteed.')}</p><button class="btn ghost" id="diet-download">${t('تنزيل الشهر كنص','Download month as text')}</button></div>`;
 }
 view.innerHTML=`<h1>${t('الأكل','Nutrition')} <span class="mut" style="font-size:15px">V11</span></h1><p class="sub">${t('مكان مستقل لخطة أكل 30 يوم. من InBody أو الطول والوزن، من غير اشتراك.','A separate home for a 30-day meal outline. Use InBody or height and weight, with no subscription.')}</p>${plan}
 <details class="card" ${!p.start?'open':''}><summary><b>${p.start?t('تعديل البيانات / خطة جديدة','Edit inputs / new outline'):t('ابدأ خطة الشهر','Start your month')}</b></summary><form id="diet-form">
 ${last?`<button type="button" class="btn small ghost" id="diet-scan" style="margin-top:14px">${t('استخدم آخر InBody','Use latest InBody')} (${esc(last.date)})</button><p class="note" id="diet-scan-note">${t('ينقل الوزن وBMR لو موجود. راجعهم لو القراءة قديمة.','Copies weight and BMR if available. Check them if the scan is old.')}</p>`:''}
 <div class="ib-grid">${field('diet-height','الطول (سم)','Height (cm)',p.height,120,230)}${field('diet-weight','الوزن (كجم)','Weight (kg)',p.weight,35,250)}</div>
 ${opts('diet-goal','هدفك','Your goal',[['balance','أكل متوازن','Balanced eating'],['lose','تقليل الوزن بهدوء','Gradual weight loss'],['gain','زيادة الوزن بهدوء','Gradual weight gain']],p.goal||'balance')}
 ${opts('diet-food','نوع الأكل','Food preference',[['mixed','متنوع (لحوم وأسماك وبيض وألبان)','Mixed (meat, fish, eggs, dairy)'],['veg','نباتي مع بيض وألبان','Vegetarian with eggs and dairy']],p.food||'mixed')}
 <label for="diet-start">${t('بداية الـ 30 يوم','30-day start date')}</label><input type="date" id="diet-start" required value="${esc(p.start||todayStr())}">
 <details style="margin-top:18px"><summary>${t('اختياري: تقدير احتياج الطاقة','Optional: estimated energy needs')}</summary><p class="note">${t('سيبهم فاضيين لو عايز ترتيب الوجبات بس. مفيش تخمين للعمر أو الجنس.','Leave these blank for a meal outline only. Age and sex are never guessed.')}</p>${field('diet-age','العمر (سنة)','Age (years)',p.age,18,100)}
 ${opts('diet-sex','الجنس المستخدم في المعادلة','Sex used by the equation',[['','بدون تحديد','Not specified'],['m','ذكر','Male'],['f','أنثى','Female']],p.sex||'')}
 ${opts('diet-activity','نشاط يومك كله، مش الجيم بس','Whole-day activity, not gym alone',[['low','قليل: قعدة أغلب اليوم','Low: mostly seated'],['light','خفيف: حركة ومشي خفيف','Light: some movement and walking'],['moderate','متوسط: حركة وتمرين منتظم','Moderate: movement and regular exercise']],p.activity||'low')}
 ${field('diet-bmr','BMR من الجهاز فقط (اختياري)','Scan BMR only (optional)',p.bmr,800,3000)}</details>
 <label class="diet-check"><input type="checkbox" id="diet-adult" ${p.adult?'checked':''}>${t('عمري 18 سنة أو أكتر','I am 18 or older')}</label>
 <label class="diet-check"><input type="checkbox" id="diet-medical">${t('عندي حساسية أكل، أو مرض مزمن/أدوية مؤثرة على التغذية، أو اضطراب أكل، أو حمل/رضاعة','I have food allergies, chronic conditions/medicines affecting diet, an eating disorder, or pregnancy/breastfeeding')}</label>
 <p id="diet-error" role="alert" style="color:var(--red)"></p><button class="btn" type="submit">${p.start?t('إنشاء شهر جديد (يستبدل الحالي)','Create new month (replaces current)'):t('رتب لي 30 يوم','Build my 30-day outline')}</button></form></details>
 <p class="note">${t('بياناتك والخطة على جهازك فقط، لا بتتبعت للشلة ولا لأي خدمة ذكاء اصطناعي. بتدخل في النسخة الاحتياطية، فاحتفظ بيها في مكان آمن. ده ترتيب وجبات بقواعد ثابتة مش تحليل طبي لصورة InBody.','Your inputs and outline stay on this device, not sent to the crew or an AI service. They are included in backups, so store backups safely. This is a rule-based meal outline, not medical interpretation of an InBody image.')}</p>
 <details class="card"><summary>${t('المصادر وحدود الخطة','Sources and limits')}</summary><p class="note">${t('الوجبات أمثلة من مجموعات الأكل المتوازن. مش علاج ولا خطة رياضي محترف أو نباتي صرف. تقدير الطاقة للبالغين الأصحاء، مش قياس فعلي.','Meals are examples using balanced food groups, not treatment or plans for elite athletes or vegans. Energy is estimated for healthy adults, not measured.')}</p><p><a href="https://www.nhs.uk/live-well/eat-well/food-guidelines-and-food-labels/the-eatwell-guide/" target="_blank" rel="noopener">NHS Eatwell Guide</a></p><p><a href="https://pubmed.ncbi.nlm.nih.gov/2305711/" target="_blank" rel="noopener">Mifflin–St Jeor</a></p><p><a href="https://reference.medscape.com/calculator/846/mifflin-st-jeor-equation-calculator" target="_blank" rel="noopener">${t('المعادلة ومعاملات النشاط','Equation and activity factors')}</a></p></details>`;
 view.querySelectorAll('[data-dw]').forEach(b=>b.onclick=()=>{dietWeek=+b.dataset.dw;renderDiet();window.scrollTo(0,0);});
 view.querySelectorAll('[data-dd]').forEach(b=>b.onchange=()=>{S.diet.done=S.diet.done||[];S.diet.done[+b.dataset.dd]=b.checked;save();view.querySelector('#diet-progress').textContent=S.diet.done.filter(Boolean).length+'/30';b.closest('details').querySelector('summary>span:last-child').textContent=b.checked?'✓':'+';});
 const scan=view.querySelector('#diet-scan');if(scan)scan.onclick=()=>{view.querySelector('#diet-weight').value=last.weight;view.querySelector('#diet-bmr').value=last.bmr||'';view.querySelector('#diet-scan-note').textContent=t('اتنقل الوزن وBMR المتاحين من قراءة ','Copied available weight and BMR from ')+last.date;};
 const dl=view.querySelector('#diet-download');if(dl)dl.onclick=()=>{const url=URL.createObjectURL(new Blob([dietPlanText(S.diet)],{type:'text/plain;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='elgamed-meals-'+p.start+'.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),5000);};
 view.querySelector('#diet-form').onsubmit=e=>{
 e.preventDefault();const val=id=>view.querySelector('#diet-'+id).value, num=id=>val(id).trim()===''?null:Number(val(id));
 const next={height:num('height'),weight:num('weight'),age:num('age'),sex:val('sex'),activity:val('activity'),bmr:num('bmr'),goal:val('goal'),food:val('food'),start:val('start'),adult:view.querySelector('#diet-adult').checked,medical:view.querySelector('#diet-medical').checked,done:[]};
 const err=dietValidate(next);if(err){view.querySelector('#diet-error').textContent=err;return;}
 if(p.start&&!confirm(t('تستبدل الشهر الحالي وتمسح علامات الأيام؟','Replace the current month and clear its checkmarks?')))return;
 S.diet=next;dietWeek=0;save();renderDiet();window.scrollTo(0,0);
 };
}

navbar.querySelectorAll(".navbtn").forEach(b=>{
  b.onclick = ()=>{ nav = b.dataset.v; render(); window.scrollTo(0,0); };
});

if("serviceWorker" in navigator && location.protocol.indexOf("http")===0){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
render();
pushMyStatusUpsert();
let shownDate=todayStr();document.addEventListener("visibilitychange",()=>{if(!document.hidden && todayStr()!==shownDate){shownDate=todayStr();render();pushMyStatusUpsert();}});
})();
